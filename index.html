<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC 多益單字特訓王Pro</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #06b6d4;
            --background-color: #f8fafc;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--background-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .tab-btn {
            padding: 10px 20px; border: none; background-color: #e2e8f0;
            color: #4a5568; border-radius: 20px; cursor: pointer; font-weight: bold;
        }
        .tab-btn.active { background-color: var(--primary-color); color: white; }

        .container {
            width: 100%; max-width: 500px; min-height: 400px; background: white;
            padding: 30px; border-radius: 16px; box-shadow: var(--card-shadow);
            box-sizing: border-box; display: flex; flex-direction: column;
        }

        .panel { display: none; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        .panel.active { display: flex; }

        /* 單字卡外框 */
        .flashcard {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white; min-height: 250px; border-radius: 12px;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; cursor: pointer; text-align: center;
            padding: 35px 25px 25px 25px; box-sizing: border-box; position: relative;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        /* 功能按鈕 */
        .audio-btn, .fav-btn {
            position: absolute; background: rgba(255,255,255,0.2); border: none;
            color: white; font-size: 1.3rem; cursor: pointer; padding: 0; border-radius: 50%;
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
            z-index: 10;
        }
        .audio-btn:hover, .fav-btn:hover { background: rgba(255,255,255,0.4); }
        .audio-btn { top: 15px; left: 15px; }
        .fav-btn { top: 15px; right: 15px; background: rgba(255,255,255,0.1); font-size: 1.6rem;}

        /* 卡片內文字樣式 */
        #card-front-text { font-size: 2.2rem; font-weight: bold; letter-spacing: 0.5px; margin: 0; }
        #card-back-area { width: 100%; text-align: center; }
        .word-ch { font-size: 1.6rem; font-weight: bold; margin: 0 0 12px 0; color: #fff; }
        
        .word-ex { 
            font-size: 1rem; opacity: 0.95; line-height: 1.5; margin: 0; 
            background: rgba(0,0,0,0.15); padding: 12px; border-radius: 8px; 
            text-align: left; word-break: break-word; cursor: pointer;
            transition: background 0.2s; position: relative;
        }
        .word-ex:hover { background: rgba(0,0,0,0.25); }
        .ex-hint { font-size: 0.7rem; opacity: 0.5; display: block; margin-bottom: 4px; text-align: right; }

        /* 【新進功能】翻譯開關按鈕與外框樣式 */
        .translation-toggle {
            background: rgba(255, 255, 255, 0.2); margin-top: 12px; padding: 6px 14px;
            border-radius: 6px; font-size: 0.85rem; font-weight: bold; cursor: pointer;
            display: inline-block; transition: background 0.2s;
        }
        .translation-toggle:hover { background: rgba(255, 255, 255, 0.35); }
        
        .translation-box {
            display: none; background: rgba(0, 0, 0, 0.2); color: #ffffff;
            margin-top: 10px; padding: 10px 12px; border-radius: 8px; text-align: left;
            font-size: 0.9rem; line-height: 1.4; border-left: 3px solid var(--secondary-color);
        }

        .click-hint { position: absolute; bottom: 10px; font-size: 0.8rem; opacity: 0.6; animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 0.8; }
            100% { opacity: 0.4; }
        }

        /* 測驗 */
        .quiz-word { font-size: 2rem; font-weight: bold; text-align: center; margin: 20px 0; color: #1e293b; }
        .options-grid { display: grid; gap: 12px; }
        .option-btn {
            padding: 14px; border: 2px solid #e2e8f0; background: white;
            border-radius: 8px; cursor: pointer; font-size: 1rem; text-align: left;
            font-weight: 500; color: #334155;
        }
        
        .ctrl-btns { display: flex; justify-content: space-between; margin-top: 25px; gap: 15px; }
        .action-btn {
            padding: 12px 24px; border: none; background-color: var(--secondary-color);
            color: white; border-radius: 8px; cursor: pointer; font-weight: bold; flex-grow: 1;
            text-align: center;
        }
        #feedback { text-align: center; font-weight: bold; margin-top: 15px; font-size: 1.1rem; min-height: 24px; }
    </style>
</head>
<body>

    <header style="text-align: center; margin-bottom: 20px;">
        <h2 style="color: #1e293b; margin-bottom: 5px;">TOEIC 多益單字特訓王</h2>
        <p style="color: #64748b; margin: 0; font-size: 0.9rem;">點擊單字卡片即可翻面看中文解答</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('card-panel')">單字翻卡</button>
        <button class="tab-btn" onclick="switchTab('quiz-panel')">四選一測驗</button>
        <button class="tab-btn" onclick="switchTab('fav-panel')">錯題/收藏本 (<span id="fav-count">0</span>)</button>
    </div>

    <div class="container">
        <div id="card-panel" class="panel active">
            <div class="flashcard" onclick="flipCard()">
                <button class="audio-btn" onclick="speakCurrentWord(event)">🔊</button>
                <button class="fav-btn" id="card-fav-toggle" onclick="toggleFavorite(event)">🤍</button>
                
                <h2 id="card-front-text">載入中...</h2>
                
                <div id="card-back-area" style="display:none;">
                    <p class="word-ch" id="card-ch"></p>
                    <div class="word-ex" id="card-ex-box" onclick="speakCurrentExample(event)">
                        <span class="ex-hint">🔊 點擊區塊可聽整句發音</span>
                        <span id="card-ex"></span>
                    </div>
                    
                    <div class="translation-toggle" onclick="toggleTranslation(event)">👁️ 顯示例句翻譯</div>
                    <div class="translation-box" id="card-translation" onclick="event.stopPropagation()"></div>
                </div>

                <span class="click-hint">點擊卡片翻面</span>
            </div>
            <div class="ctrl-btns">
                <button class="action-btn" style="background-color: #64748b;" onclick="prevWord()">上一個</button>
                <button class="action-btn" onclick="nextWord()">下一個 (隨機)</button>
            </div>
        </div>

        <div id="quiz-panel" class="panel">
            <div class="quiz-word" id="quiz-question">Question</div>
            <div class="options-grid" id="quiz-options"></div>
            <div id="feedback"></div>
            <div class="ctrl-btns" style="justify-content: flex-end;">
                <button class="action-btn" onclick="initQuiz()">下一題</button>
            </div>
        </div>

        <div id="fav-panel" class="panel">
            <div id="fav-list-container" style="max-height: 300px; overflow-y: auto; margin-bottom: 15px;">
                </div>
            <button class="action-btn" style="background-color: #ef4444; flex-grow: 0;" onclick="clearAllFavorites()">清空錯題本</button>
        </div>
    </div>

    <script>
        let wordDatabase = [];
        let currentIndex = 0;
        let isFlipped = false;
        let favorites = JSON.parse(localStorage.getItem('toeic_favs')) || [];
        let currentQuizWord = null;

        let cardHistory = [];
        let historyPointer = -1;
        let isTranslationOpen = false; // 追蹤翻譯區塊是否開啟

        // 頁面初始化：讀取外部 JSON
        async function loadWords() {
            try {
                const response = await fetch('words.json');
                wordDatabase = await response.json();
                updateFavCount();
                
                if (wordDatabase.length > 0) {
                    currentIndex = Math.floor(Math.random() * wordDatabase.length);
                    cardHistory.push(currentIndex);
                    historyPointer = 0;
                }
                
                updateCard();
            } catch (error) {
                document.getElementById('card-front-text').innerText = "無法載入單字庫，請確認 JSON 檔案是否存在。";
                console.error("Error loading JSON:", error);
            }
        }

        // 切換面板
        function switchTab(panelId) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(panelId).classList.add('active');
            
            if(event && event.target) {
                event.target.classList.add('active');
            }

            if(panelId === 'quiz-panel') initQuiz();
            if(panelId === 'fav-panel') renderFavorites();
        }

        // --- 發音核心功能 ---
        function speakWord(text, isSentence = false) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = isSentence ? 0.85 : 0.9; 
                window.speechSynthesis.speak(utterance);
            }
        }
        
        function speakCurrentWord(e) {
            e.stopPropagation(); 
            if(wordDatabase[currentIndex]) speakWord(wordDatabase[currentIndex].en, false);
        }

        function speakCurrentExample(e) {
            e.stopPropagation(); 
            if(wordDatabase[currentIndex]) speakWord(wordDatabase[currentIndex].ex, true);
        }

        // --- 錯題本邏輯 ---
        function updateFavCount() {
            document.getElementById('fav-count').innerText = favorites.length;
        }

        // --- 【新進核心】切換顯示例句翻譯功能 ---
        function toggleTranslation(e) {
            e.stopPropagation(); // 阻止卡片翻回去
            const box = document.getElementById('card-translation');
            isTranslationOpen = !isTranslationOpen;
            
            if(isTranslationOpen) {
                box.style.display = 'block';
                e.target.innerText = "🙈 隱藏例句翻譯";
            } else {
                box.style.display = 'none';
                e.target.innerText = "👁️ 顯示例句翻譯";
            }
        }

        // --- 單字卡邏輯 ---
        function updateCard() {
            if(wordDatabase.length === 0) return;
            const word = wordDatabase[currentIndex];
            
            document.getElementById('card-front-text').innerText = `${word.en} (${word.pos})`;
            document.getElementById('card-ch').innerText = word.ch;
            document.getElementById('card-ex').innerText = `例句：${word.ex}`;
            
            // 填入 JSON 中的中文例句翻譯 (如果有 ex_ch 欄位就顯示，沒有就給溫馨提示)
            const chTranslation = word.ex_ch ? word.ex_ch : "（此例句目前尚未在 words.json 中建置翻譯）";
            document.getElementById('card-translation').innerText = chTranslation;
            
            // 每當換到下一張卡片，重設翻譯視窗為關閉狀態
            document.getElementById('card-translation').style.display = 'none';
            const toggleBtn = document.querySelector('.translation-toggle');
            if(toggleBtn) toggleBtn.innerText = "👁️ 顯示例句翻譯";
            isTranslationOpen = false;

            const isFav = favorites.some(item => item.id === word.id);
            document.getElementById('card-fav-toggle').innerText = isFav ? "❤️" : "🤍";
            
            document.getElementById('card-front-text').style.display = 'block';
            document.getElementById('card-back-area').style.display = 'none';
            isFlipped = false;
        }

        function flipCard() {
            const front = document.getElementById('card-front-text');
            const back = document.getElementById('card-back-area');
            
            if(isFlipped) {
                front.style.display = 'block';
                back.style.display = 'none';
            } else {
                front.style.display = 'none';
                back.style.display = 'block';
                speakWord(wordDatabase[currentIndex].en, false);
            }
            isFlipped = !isFlipped;
        }

        function nextWord() { 
            if (wordDatabase.length === 0) return;
            if (historyPointer < cardHistory.length - 1) {
                historyPointer++;
                currentIndex = cardHistory[historyPointer];
            } else {
                currentIndex = Math.floor(Math.random() * wordDatabase.length);
                cardHistory.push(currentIndex);
                historyPointer++;
            }
            updateCard(); 
        }

        function prevWord() { 
            if (historyPointer > 0) {
                historyPointer--;
                currentIndex = cardHistory[historyPointer];
                updateCard();
            }
        }

        function toggleFavorite(e) {
            e.stopPropagation(); 
            const currentWord = wordDatabase[currentIndex];
            const favIndex = favorites.findIndex(item => item.id === currentWord.id);
            
            if (favIndex > -1) {
                favorites.splice(favIndex, 1);
            } else {
                favorites.push(currentWord);
            }
            
            localStorage.setItem('toeic_favs', JSON.stringify(favorites));
            updateFavCount();
            updateCard();
        }

        function renderFavorites() {
            const container = document.getElementById('fav-list-container');
            container.innerHTML = "";
            if(favorites.length === 0) {
                container.innerHTML = "<p style='color:#718096; text-align:center; padding: 20px;'>目前錯題本空空如也！</p>";
                return;
            }
            favorites.forEach(word => {
                const div = document.createElement('div');
                div.style = "padding: 12px; border-bottom: 1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center;";
                div.innerHTML = `
                    <div>
                        <strong style="color:var(--primary-color); font-size:1.1rem;">${word.en}</strong> (${word.pos})<br>
                        <span style="color:#4a5568;">${word.ch}</span>
                    </div>
                    <button class="action-btn" style="padding:5px 10px; background-color:#718096; flex-grow:0;" onclick="speakWord('${word.en}', false)">🔊</button>
                `;
                container.appendChild(div);
            });
        }

        function clearAllFavorites() {
            if(confirm("確定要清空所有錯題紀錄嗎？")) {
                favorites = [];
                localStorage.setItem('toeic_favs', JSON.stringify(favorites));
                updateFavCount();
                renderFavorites();
                updateCard();
            }
        }

        // --- 測驗邏輯 ---
        function initQuiz() {
            if(wordDatabase.length === 0) return;
            document.getElementById('feedback').innerText = "";
            
            currentQuizWord = wordDatabase[Math.floor(Math.random() * wordDatabase.length)];
            document.getElementById('quiz-question').innerText = currentQuizWord.en;
            speakWord(currentQuizWord.en, false);

            let choices = [currentQuizWord.ch];
            while(choices.length < Math.min(4, wordDatabase.length)) {
                let randomCh = wordDatabase[Math.floor(Math.random() * wordDatabase.length)].ch;
                if(!choices.includes(randomCh)) choices.push(randomCh);
            }
            choices.sort(() => Math.random() - 0.5);

            const optionsGrid = document.getElementById('quiz-options');
            optionsGrid.innerHTML = "";
            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = choice;
                btn.onclick = () => checkAnswer(btn, choice);
                optionsGrid.appendChild(btn);
            });
        }

        function checkAnswer(btn, choice) {
            const feedback = document.getElementById('feedback');
            if(choice === currentQuizWord.ch) {
                feedback.innerText = "🎉 回答正確！";
                feedback.style.color = "#10b981";
                btn.style.backgroundColor = "#d1fae5";
                btn.style.borderColor = "#10b981";
            } else {
                feedback.innerText = "❌ 答錯了！已自動加入錯題本。";
                feedback.style.color = "#ef4444";
                btn.style.backgroundColor = "#fee2e2";
                btn.style.borderColor = "#ef4444";
                
                if (!favorites.some(item => item.id === currentQuizWord.id)) {
                    favorites.push(currentQuizWord);
                    localStorage.setItem('toeic_favs', JSON.stringify(favorites));
                    updateFavCount();
                }
            }
        }

        // 啟動
        loadWords();
    </script>
</body>
</html>
